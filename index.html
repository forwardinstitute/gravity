// Every tunable value lives here. All values are illustrative until the M5 feel pass.
// Distances are in board units: the board is always 400 units wide.
const CONFIG = {
  seed: null,            // null: a fresh random board every game. Set a number to fix one board for everyone
  boardWidth: 400,
  ballRadius: 17,
  fallSpeed: 42,         // units per second at the start

// The Gravity G, cream, drawn onto a Night tile at load to make the tab and home-screen icons.
const G_MARK = new Image();
G_MARK.onload = () => {
  const c = document.createElement("canvas"); c.width = c.height = 180;
  const g = c.getContext("2d");
  g.fillStyle = "#212122"; g.fillRect(0, 0, 180, 180);
  const h = 120, w = h * G_MARK.naturalWidth / G_MARK.naturalHeight;
  g.drawImage(G_MARK, (180 - w) / 2, (180 - h) / 2, w, h);
  const url = c.toDataURL("image/png");
  document.getElementById("icon").href = url;

// ===== Seeded random numbers (mulberry32) =====
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ===== Geometry =====
function closestOnSeg(px, py, a, b) {

  let u = l2 ? ((px - a.x) * dx + (py - a.y) * dy) / l2 : 0;

  return { x: a.x + u * dx, y: a.y + u * dy };
}

  const c = closestOnSeg(px, py, a, b);
  return Math.hypot(c.x - px, c.y - py);
}

    }
    if (hit) { b.x = ox; b.y = oy; b.vx = 0; b.vy = 0; b.state = "stuck"; continue; }

    if (b.y + R >= H) { lose(b.x, H - R * 0.5); return; }
  }

  // Falling balls that meet each other slide apart and trade sideways speed.
  for (let i = 0; i < balls.length; i++) {
    const a = balls[i];
    if (a.state !== "falling") continue;
    for (let j = i + 1; j < balls.length; j++) {
      const b = balls[j];
      if (b.state !== "falling") continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < 2 * R) {
        const push = (2 * R - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
        const tv = a.vx; a.vx = b.vx; b.vx = tv;
        const tw = a.vy || 0; a.vy = b.vy || 0; b.vy = tw;
      }
    }
  }

  if (line) checkLineAgainstFalling();

}

// ===== Nudge =====
// A tap is a push outwards from the finger: every free-falling ball in reach moves away from it,
// in any direction, harder the closer it is. One nudge is spent per tap, however many balls move.
// Stuck balls don't move: sticking is a commitment.
function nudge(p) {
  const hits = [];
  for (const o of balls) {
    if (o.state !== "falling") continue;
    const d = Math.hypot(o.x - p.x, o.y - p.y);
    if (d - R <= CONFIG.nudgeReach) hits.push({ o, d });
  }
  if (!hits.length) return; // nothing free-falling in reach: nothing happens, nothing spent
  if (nudges <= 0) { shake = 0.4; return; }
  for (const { o, d } of hits) {
    const k = 1 - Math.max(0, d - R) / CONFIG.nudgeReach; // 1 beside the finger, 0 at the edge of reach
    const nx = d > 0 ? (o.x - p.x) / d : 0, ny = d > 0 ? (o.y - p.y) / d : -1;
    o.vx = (o.vx || 0) + nx * CONFIG.nudgeStrength * k;
    o.vy = (o.vy || 0) + ny * CONFIG.nudgeStrength * k;
  }
  nudges--;
  fx.push({ type: "nudge", x: p.x, y: p.y, age: 0, life: 0.4 });
}

// ===== Drawing and joining =====
function ballAt(p) {
  let best = null, bd = Infinity;
  for (const o of balls) {
    if (o.state !== "falling" && o.state !== "stuck" && o.state !== "wall") continue; // a chain can be extended from any of its balls
    const d = Math.hypot(o.x - p.x, o.y - p.y);
    if (d < R * CONFIG.touchSlop && d < bd) { bd = d; best = o; }
  }
  return best;
}

function startLine(b, pid, p) {
  b.prev = b.state;
  if (b.state !== "wall") b.state = "pinned"; // a ball already in a wall is fixed anyway
  b.vx = 0; b.vy = 0;
  line = { ball: b, pid, pts: [{ x: b.x, y: b.y }], finger: p };
}

function cancelLine() {
  if (!line) return;
  line.ball.state = line.ball.prev;
  line = null;
}

// A same-colour ball that is falling, stuck, or already part of a wall can be joined.
function canJoin(o, s) {
  return o !== s && o.c === s.c && (o.state === "falling" || o.state === "stuck" || o.state === "wall");
}

function edgePoint(c, toward) {
  const dx = toward.x - c.x, dy = toward.y - c.y, d = Math.hypot(dx, dy) || 1;
  return { x: c.x + dx / d * R, y: c.y + dy / d * R };
}
// Walls run from the edge of one ball to the edge of the other, so a new line can leave or reach
// a ball that already has a wall on it without touching that wall.
function trimToEdges(pts, A, B) {
  let i = 0, j = pts.length - 1;
  while (i < pts.length && Math.hypot(pts[i].x - A.x, pts[i].y - A.y) < R) i++;
  while (j >= 0 && Math.hypot(pts[j].x - B.x, pts[j].y - B.y) < R) j--;
  if (i > j) return [edgePoint(A, B), edgePoint(B, A)];
  const mid = pts.slice(i, j + 1);
  return [edgePoint(A, mid[0])].concat(mid, [edgePoint(B, mid[mid.length - 1])]);
}

// The ids of every ball in the chain holding this one, found by following walls.
function chainOf(id) {
  const chain = new Set([id]), queue = [id];
  while (queue.length) {
    const cur = queue.pop();
    for (const w of walls) {
      const other = w.a === cur ? w.b : w.b === cur ? w.a : null;
      if (other !== null && !chain.has(other)) { chain.add(other); queue.push(other); }
    }
  }
  return chain;
}

// fromFinger: the join was made by the finger reaching the ball, so the stroke carries on from it.
function join(o, prefix, a, b, fromFinger) {
  const s = line.ball, pid = line.pid;
  // A merge is a join between two separate chains that each already hold two or more balls.
  const cs = chainOf(s.id), co = chainOf(o.id);
  const merge = !cs.has(o.id) && cs.size >= 2 && co.size >= 2;
  const cp = closestOnSeg(o.x, o.y, a, b);
  const raw = prefix.concat([cp, { x: o.x, y: o.y }]);
  walls.push({ pts: trimToEdges(raw, s, o), c: s.c, a: s.id, b: o.id });
  s.state = "wall"; o.state = "wall"; s.vx = 0; o.vx = 0; s.vy = 0; o.vy = 0;
  score += CONFIG.pointsPerJoin; nudges++;
  fx.push({ type: "join", x: o.x, y: o.y, c: s.c, age: 0, life: 0.5 });
  line = null;
  clearChain(s, merge);
  // One stroke can thread several balls: keep drawing from the ball just reached, unless the
  // join cleared it or ended the game. Lifting the finger ends the stroke.
  if (fromFinger && state === "playing" && balls.includes(o)) {
    o.prev = "wall";
    line = { ball: o, pid, pts: [{ x: o.x, y: o.y }], finger: { x: b.x, y: b.y }, cameFrom: walls[walls.length - 1] };
  }
}

// If the chain holding this ball has reached CONFIG.clearChain balls, it clears: its balls and
// walls leave the board, it scores its length squared (boosted if a merge made it), and anything
// that was resting on it falls again.
function clearChain(start, merge) {
  const chain = chainOf(start.id);
  bestChain = Math.max(bestChain, chain.size);
  if (chain.size < CONFIG.clearChain) return;
  const gain = chain.size * chain.size * (merge ? CONFIG.mergeBoost : 1);
  score += gain;
  clears++;
  let mx = 0, my = 0;
  for (const b of balls) if (chain.has(b.id)) {
    fx.push({ type: "clear", x: b.x, y: b.y, c: b.c, age: 0, life: 0.6 });
    mx += b.x / chain.size; my += b.y / chain.size;
  }
  fx.push({ type: "points", x: mx, y: my, text: "+" + gain, boost: merge, age: 0, life: 1.1 });
  balls = balls.filter(b => !chain.has(b.id));
  walls = walls.filter(w => !chain.has(w.a));
  resettle();
}

// Stuck balls stay stuck only while something holds them: a wall, a joined ball, the pinned ball,
// or another stuck ball that is itself held. The rest fall again.
function resettle() {
  const touch = 2 * R + 2;
  const held = new Set();
  const stuck = balls.filter(b => b.state === "stuck");
  for (const b of stuck) {
    if (nearWall(b.x, b.y, R + LH + 2) ||
        balls.some(o => (o.state === "wall" || o.state === "pinned") && Math.hypot(o.x - b.x, o.y - b.y) < touch)) held.add(b);
  }
  let grew = true;
  while (grew) {
    grew = false;
    for (const b of stuck) {
      if (held.has(b)) continue;
      for (const o of held) if (Math.hypot(o.x - b.x, o.y - b.y) < touch) { held.add(b); grew = true; break; }
    }
  }
  for (const b of stuck) if (!held.has(b)) { b.state = "falling"; b.vx = 0; b.vy = 0; }
}

// Checks the newest segment of the line being drawn. Returns "ok", "join" or "lose".
function checkSegment(a, q) {
  const s = line.ball;
  if (q.x < LH || q.x > W - LH || q.y < LH || q.y > H - LH) {
    lose(Math.max(0, Math.min(W, q.x)), Math.max(0, Math.min(H, q.y)));
    return "lose";
  }
  let target = null, td = Infinity;
  for (const o of balls) {
    if (o === s) continue;
    if (distPtSeg(o.x, o.y, a, q) < R + LH) {
      if (canJoin(o, s)) {
        const d = Math.hypot(o.x - a.x, o.y - a.y);
        if (d < td) { td = d; target = o; }
      } else { lose(o.x, o.y); return "lose"; }
    }
  }
  // Walls attached to the ball the line leaves, or the ball it is reaching, get a small grace zone
  // around that ball, so leaving or arriving at a shallow angle beside your own wall is allowed.
  const exempt = [s].concat(target ? [target] : []);
  for (const w of walls) {
    let A = a, Q = q, skip = false;
    for (const e of exempt) {
      if (w.a !== e.id && w.b !== e.id) continue;
      const clipped = clipOutside(A, Q, e, R + CONFIG.wallGrace);
      if (!clipped) { skip = true; break; }
      [A, Q] = clipped;
    }
    if (skip) continue;
    for (let i = 0; i < w.pts.length - 1; i++) {
      if (segSegDist(A, Q, w.pts[i], w.pts[i + 1]) < 2 * LH) {
        // A carried-on stroke that runs back over the line it has only just made, close to the ball,
        // simply ends the stroke: dragging back the way you came reads as "done", not a crash.
        if (w === line.cameFrom && Math.hypot(q.x - s.x, q.y - s.y) < R * 4) { cancelLine(); return "cancel"; }
        const c = closestOnSeg(Q.x, Q.y, w.pts[i], w.pts[i + 1]);
        lose(c.x, c.y); return "lose";
      }
    }
  }
  const pts = line.pts;
  for (let i = 0; i < pts.length - 1 - CONFIG.selfSkip; i++) {
    if (segSegDist(a, q, pts[i], pts[i + 1]) < 2 * LH) { lose(q.x, q.y); return "lose"; }
  }
  if (target) { join(target, pts.slice(), a, q, true); return "join"; }
  return "ok";
}

function extendLine(p) {
  if (!line) return;
  line.finger = p;
  // A line starts recording only once the finger has left the ball it starts from, so a stroke
  // carried on through a ball never picks up the points left behind inside it.
  if (line.pts.length === 1 && Math.hypot(p.x - line.ball.x, p.y - line.ball.y) < R) return;
  const last = line.pts[line.pts.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < CONFIG.minSegment) return;
  const q = { x: p.x, y: p.y };
  if (checkSegment(last, q) === "ok") line.pts.push(q);
}

// Every frame while drawing: a falling ball that runs into the line ends the game,
// unless it is the same colour as the start, in which case it completes the join.
function checkLineAgainstFalling() {
  const s = line.ball, pts = line.pts;
  for (const o of balls) {
    if (o.state !== "falling" || o === s) continue;
    for (let i = 0; i < pts.length - 1; i++) {
      if (distPtSeg(o.x, o.y, pts[i], pts[i + 1]) < R + LH) {
        if (o.c === s.c) join(o, pts.slice(0, i + 1), pts[i], pts[i + 1]);
        else lose(o.x, o.y);
        return;
      }
    }
  }
}

// ===== Input =====
function toBoard(e) {
  return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale };
}
function replayHit(p) {
  const c = replayCentre();
  return Math.hypot(p.x - c.x, p.y - c.y) < 60;
}
function replayCentre() { return { x: W / 2, y: H * 0.36 + 170 }; }

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const p = toBoard(e);
  if (state === "ready") { reset(); state = "playing"; return; }
  if (state === "over") {
    if (overAge > 0.5 && replayHit(p)) { reset(); state = "playing"; }
    return;
  }
  if (line) return; // one line at a time
  const b = ballAt(p);
  if (b) {
    startLine(b, e.pointerId, p);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  } else {
    nudge(p);
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (state !== "playing" || !line || e.pointerId !== line.pid) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    if (!line || state !== "playing") break;
    extendLine(toBoard(ev));
  }
});
function endPointer(e) {
  if (line && e.pointerId === line.pid && state === "playing") cancelLine();
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

// Stop iOS scrolling, rubber-banding, double-tap zoom and pinch-zoom.
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// ===== Layout =====
let lastVw = 0, lastVh = 0;
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 4);
  const vw = window.innerWidth, vh = window.innerHeight;
  lastVw = vw; lastVh = vh;
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + "px";
  canvas.style.height = vh + "px";
  if (H === undefined) {
    // The board's height is fixed once, from the first screen shape, between 3:2 and 21:10 tall.
    const aspect = Math.min(2.1, Math.max(1.5, vh / Math.min(vw, vh / 1.5)));
    H = Math.round(W * aspect);
  }
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2;
  offY = (vh - H * scale) / 2;
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", layout);
window.addEventListener("load", layout);

// ===== Drawing =====
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
  return `rgb(${r},${g},${b})`;
}

function strokePath(pts, colour, width, alpha) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();
}

function drawBall(b) {
  const col = CONFIG.colours[b.c];
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.state === "pinned" || (line && line.ball === b)) {
    ctx.beginPath(); ctx.arc(0, 0, R + 6, 0, Math.PI * 2);
    ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = 4; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fillStyle = b.state === "wall" ? shade(col, 0.82) : col;
  ctx.fill();
  ctx.lineWidth = b.state === "stuck" ? 2.5 : 1.5;
  ctx.strokeStyle = b.state === "stuck" ? "rgba(33,33,34,0.45)" : shade(col, 0.82);
  ctx.stroke();
  ctx.fillStyle = CONFIG.markColours[b.c];
  ctx.strokeStyle = CONFIG.markColours[b.c];
  const m = CONFIG.marks[b.c];
  if (m === "dot") { ctx.beginPath(); ctx.arc(0, 0, R * 0.3, 0, Math.PI * 2); ctx.fill(); }
  else if (m === "ring") { ctx.beginPath(); ctx.arc(0, 0, R * 0.48, 0, Math.PI * 2); ctx.lineWidth = R * 0.18; ctx.stroke(); }
  else if (m === "bar") { ctx.fillRect(-R * 0.52, -R * 0.12, R * 1.04, R * 0.24); }
  ctx.restore();
}

// The longest chain, drawn as that many linked dots, so the second stat needs no words.
function drawChainGlyph(cx, cy, n) {
  if (n < 2) return;
  const shown = Math.min(n, 12), gap = 22, x0 = cx - (shown - 1) * gap / 2;
  ctx.save();
  ctx.strokeStyle = BRAND.night; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x0 + (shown - 1) * gap, cy); ctx.stroke();
  ctx.fillStyle = BRAND.night;
  for (let i = 0; i < shown; i++) { ctx.beginPath(); ctx.arc(x0 + i * gap, cy, 7, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

function drawReplayIcon(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2);
  ctx.fillStyle = BRAND.night; ctx.fill();
  ctx.strokeStyle = BRAND.day; ctx.lineWidth = 5; ctx.lineCap = "round";
  const a0 = -Math.PI * 0.35, a1 = Math.PI * 1.35, r = 16;
  ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.stroke();
  const ex = Math.cos(a0) * r, ey = Math.sin(a0) * r;
  ctx.fillStyle = BRAND.day;
  ctx.beginPath();
  ctx.moveTo(ex + 8, ey - 2); ctx.lineTo(ex - 4, ey - 9); ctx.lineTo(ex - 2, ey + 6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawImageCentred(img, cx, cy, w) {
  if (!img.complete || !img.naturalWidth) return;
  const h = w * img.naturalHeight / img.naturalWidth;
  ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
}
function drawWordmark(cx, cy, w) { drawImageCentred(WORDMARK, cx, cy, w); }

function drawPlayIcon(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI * 2);
  ctx.fillStyle = "#ffcc12"; ctx.fill();
  ctx.fillStyle = BRAND.night;
  ctx.beginPath(); ctx.moveTo(-12, -18); ctx.lineTo(20, 0); ctx.lineTo(-12, 18); ctx.closePath(); ctx.fill();
  ctx.restore();
}

let fps = 60;

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = BRAND.day2;
  ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.fillStyle = BRAND.day;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(33,33,34,0.12)";
  ctx.fillRect(0, H - 4, W, 4); // the floor balls must never reach

  if (state === "ready") {
    // Night cover: the Gravity wordmark, three still balls, a Sunshine play button, and the FI wordmark at the foot.
    ctx.fillStyle = BRAND.night;
    ctx.fillRect(0, 0, W, H);
    drawImageCentred(GRAVITY, W / 2, H * 0.2, 300);
    drawWordmark(W / 2, H - 56, 110);
    for (let i = 0; i < 3; i++) {
      const x = W / 2 + (i - 1) * 60, y = H * 0.42;
      ctx.beginPath(); ctx.arc(x, y, R + 2.5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(252,242,227,0.22)"; ctx.fill(); // a faint Day rim so Forest holds on Night
      drawBall({ x, y, c: i, state: "falling" });
    }
    drawPlayIcon(W / 2, H * 0.6);
    ctx.restore();
    return;
  }

  for (const w of walls) strokePath(w.pts, shade(CONFIG.colours[w.c], 0.8), CONFIG.lineWidth, 1);
  if (line) {
    const col = CONFIG.colours[line.ball.c];
    const pts = line.pts.concat(state === "playing" && line.finger ? [line.finger] : []);
    strokePath(pts, col, CONFIG.lineWidth, 0.8);
  }
  for (const b of balls) drawBall(b);

  for (const f of fx) {
    const k = f.age / f.life;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.beginPath();
    if (f.type === "nudge") {
      ctx.arc(f.x, f.y, 8 + k * (CONFIG.nudgeReach + R - 8), 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(33,33,34,0.5)"; ctx.lineWidth = 2;
    } else if (f.type === "points") {
      // The points a clear earned, rising. Sunshine with a Night edge when a merge boosted it.
      ctx.font = "700 " + (f.boost ? 40 : 30) + "px " + BRAND.display;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const y = f.y - k * 50;
      if (f.boost) { ctx.lineWidth = 5; ctx.strokeStyle = BRAND.night; ctx.strokeText(f.text, f.x, y); ctx.fillStyle = "#ffcc12"; }
      else ctx.fillStyle = BRAND.night;
      ctx.fillText(f.text, f.x, y);
      ctx.restore();
      continue;
    } else if (f.type === "clear") {
      ctx.arc(f.x, f.y, R * (1 - k) + 2, 0, Math.PI * 2);
      ctx.fillStyle = CONFIG.colours[f.c]; ctx.fill();
      ctx.arc(f.x, f.y, R + k * 40, 0, Math.PI * 2);
      ctx.strokeStyle = CONFIG.colours[f.c]; ctx.lineWidth = 3;
    } else {
      ctx.arc(f.x, f.y, R + k * 22, 0, Math.PI * 2);
      ctx.strokeStyle = CONFIG.colours[f.c]; ctx.lineWidth = 4;
    }
    ctx.stroke();
    ctx.restore();
  }

  // Nudges left, as small marks. Score, as a quiet number.
  const sx = shake > 0 ? Math.sin(shake * 60) * 4 : 0;
  for (let i = 0; i < Math.min(nudges, 12); i++) {
    ctx.beginPath(); ctx.arc(18 + i * 13 + sx, 22, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(33,33,34,0.5)"; ctx.fill();
  }
  if (nudges === 0) {
    ctx.beginPath(); ctx.arc(18 + sx, 22, 4.5, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(33,33,34,0.35)"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.fillStyle = "rgba(33,33,34,0.5)";
  ctx.font = "700 24px " + BRAND.display;
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText(String(score), W - 16, 23);

  if (state === "over") {
    // The board stays visible: your walls are the picture of the game.
    ctx.fillStyle = "rgba(252,242,227,0.5)";
    ctx.fillRect(0, 0, W, H);
    const a = Math.min(1, overAge / 0.4);
    ctx.globalAlpha = a;
    // A Night band along the foot, carrying the wordmark, like the cover of FI documents.
    ctx.fillStyle = BRAND.night;
    ctx.fillRect(0, H - 64, W, 64);
    drawWordmark(W / 2, H - 32, 96);
    if (fail) {
      // Where it ended, drawn over the band so a ball lost at the floor still shows. Night and Sunshine read on both grounds.
      ctx.globalAlpha = 1;
      const pulse = 0.5 + 0.5 * Math.sin(overAge * 6), rr = 15 + pulse * 6;
      ctx.beginPath(); ctx.arc(fail.x, fail.y, rr, 0, Math.PI * 2);
      ctx.strokeStyle = BRAND.night; ctx.lineWidth = 6; ctx.stroke();
      ctx.strokeStyle = "#ffcc12"; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.globalAlpha = a;
    }
    ctx.fillStyle = BRAND.night;
    ctx.font = "700 120px " + BRAND.display;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(score), W / 2, H * 0.36);
    drawChainGlyph(W / 2, H * 0.36 + 82, bestChain);
    const rc = replayCentre();
    drawReplayIcon(rc.x, rc.y);
    ctx.globalAlpha = 1;
  }

  if (DEBUG) {
    ctx.save();
    ctx.lineWidth = 1;
    for (const b of balls) {
      ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, R + LH, 0, Math.PI * 2); ctx.strokeStyle = "rgba(255,0,0,0.35)"; ctx.stroke();
    }
    for (const w of walls) strokePath(w.pts, "rgba(0,0,0,0.8)", 1, 1);
    ctx.restore();
  }
  ctx.restore();

  if (DEBUG) {
    const speed = fallSpeed();
    const lines = [
      `fps ${fps.toFixed(0)}  t ${t.toFixed(1)}s  speed ${speed.toFixed(1)}`,
      `balls ${balls.length}  walls ${walls.length}  nudges ${nudges}  clears ${clears}  seed ${SEED}`,
      `state ${state}${line ? "  drawing " + line.pts.length + " pts" : ""}`,
      `dpr ${dpr}  canvas ${canvas.width}x${canvas.height}  screen ${innerWidth}x${innerHeight}`,
      ...Object.entries(CONFIG).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(" ") : v}`),
    ];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = "11px ui-monospace, Menlo, monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    // Sits at the bottom of the screen, clear of the spawn row, and fades so the board shows through.
    const ph = lines.length * 13 + 8, py = canvas.height / dpr - ph - 4;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(4, py, 250, ph);
    ctx.fillStyle = "#fff";
    lines.forEach((l, i) => ctx.fillText(l, 9, py + 4 + i * 13));
  }
}

// ===== Loop =====
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000;
  last = now;
  if (raw > 0) fps = fps * 0.95 + (1 / raw) * 0.05;
  const dt = Math.min(raw, 1 / 30);
  // iOS can report the wrong pixel density or size while the page is still loading (often from a
  // home-screen icon), which would leave a blurry canvas. Re-measure whenever either changes.
  if (Math.min(window.devicePixelRatio || 1, 4) !== dpr || window.innerWidth !== lastVw || window.innerHeight !== lastVh) layout();
  if (state === "playing") update(dt);
  else if (state === "over") overAge += dt;
  // Effects keep playing out after the game ends, so a last clear finishes its pop.
  if (fx) { for (const f of fx) f.age += dt; fx = fx.filter(f => f.age < f.life); }
  if (shake > 0) shake = Math.max(0, shake - dt);
  render();
  requestAnimationFrame(frame);
}

layout();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
